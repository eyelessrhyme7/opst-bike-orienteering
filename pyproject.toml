[project]
name = "opst-bike-orienteering"
version = "0.1.0"
description = "Orienteering with service times experiments on bike-share station geography."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h3>=4.1",
    "latex2mathml>=3.77",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "osmnx>=1.9",
    "pyarrow>=16.0",
    "pymupdf>=2.1",
    "python-docx>=1.2",
    "pywin32>=306; sys_platform == 'win32'",
    "scikit-learn>=1.4",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
